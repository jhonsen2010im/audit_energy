<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Energy Audit Leads{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        nav { background: #2c3e50; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #ecf0f1; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .nav-brand { font-size: 1.2rem; font-weight: bold; }
        .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block nav %}
    <nav>
        <a href="/" class="nav-brand">Energy Audit Leads</a>
        {% if session.get("user_id") %}
        <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% endif %}
    </nav>
    {% endblock %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
